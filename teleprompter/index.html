<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teleprompter Deck</title>
<meta name="description" content="Teleprompter Deck for Android — scroll your script at your pace, record to camera, and never lose your place.">
<style>
  :root { --bg:#070707; --fg:#f7f4ec; --muted:#9a9386; --accent:#e6b84c; --rule:#2a2723; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:48px 16px;
  }
  main { max-width:32rem; text-align:center; }
  .logo { width:min(300px,78%); height:auto; display:block; margin:0 auto 1.4em; }
  h1 { font-size:2rem; font-weight:700; letter-spacing:-.02em; margin:1.1em 0 .2em; }
  h1 .deck { color:var(--accent); }
  .tag { color:var(--muted); font-size:.78rem; letter-spacing:.32em; margin:0 0 1.8em; }
  p { color:var(--muted); margin:0 0 2em; }
  a { color:var(--accent); text-decoration:none; border-bottom:1px solid transparent; }
  a:hover { border-bottom-color:var(--accent); }
  footer { margin-top:3em; padding-top:1.4em; border-top:1px solid var(--rule); color:var(--muted); font-size:.82rem; }
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<main>
  <!-- The lockup from the brand kit, text already outlined so it needs no font. -->
  <img class="logo" src="logo.svg" alt="Teleprompter Deck" width="2400" height="800">
  <p class="tag">TAP. READ. ROLL.</p>
  <p>Scroll your script at your pace, record to camera, and never lose your place.</p>
  <p>
    <a href="privacy/">Privacy</a> &nbsp;·&nbsp;
    <a href="terms/">Terms</a> &nbsp;·&nbsp;
    <a href="support/">Support</a>
  </p>
  <footer>com.mysecondwish.teleprompterdeck</footer>
</main>
</body>
</html>
