<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teleprompter Deck</title>
<meta name="description" content="Teleprompter Deck for Android — scroll your script at your pace, record to camera, and never lose your place.">
<style>
  :root { --bg:#070707; --fg:#f7f4ec; --muted:#9a9386; --accent:#e6b84c; --rule:#2a2723; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:48px 16px;
  }
  main { max-width:32rem; text-align:center; }
  svg { width:132px; height:132px; }
  h1 { font-size:2rem; font-weight:700; letter-spacing:-.02em; margin:1.1em 0 .2em; }
  h1 .deck { color:var(--accent); }
  .tag { color:var(--muted); font-size:.78rem; letter-spacing:.32em; margin:0 0 1.8em; }
  p { color:var(--muted); margin:0 0 2em; }
  a { color:var(--accent); text-decoration:none; border-bottom:1px solid transparent; }
  a:hover { border-bottom-color:var(--accent); }
  footer { margin-top:3em; padding-top:1.4em; border-top:1px solid var(--rule); color:var(--muted); font-size:.82rem; }
</style>
</head>
<body>
<main>
  <!-- Same geometry as the app's mark: 288-unit viewport, see lib/ui/brand.dart -->
  <svg viewBox="0 0 288 288" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Teleprompter Deck">
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="288" height="288">
      <rect width="288" height="288" fill="#fff"/>
      <circle cx="198" cy="186" r="49" fill="#000"/>
    </mask>
    <g mask="url(#cut)" stroke="#e6b84c" stroke-linecap="round" stroke-linejoin="round">
      <rect x="56" y="66" width="150" height="112" rx="28" stroke-width="16"/>
      <path d="M84 102h82M84 128h58" stroke-width="11"/>
    </g>
    <circle cx="198" cy="186" r="34" stroke="#e6b84c" stroke-width="16"/>
    <path d="M187 171l27 15-27 15z" fill="#e6b84c" stroke="#e6b84c" stroke-width="5" stroke-linejoin="round"/>
  </svg>
  <h1>teleprompter <span class="deck">deck</span></h1>
  <p class="tag">TAP. READ. ROLL.</p>
  <p>Scroll your script at your pace, record to camera, and never lose your place.</p>
  <p><a href="privacy-policy.html">Privacy policy</a></p>
  <footer>com.ashfaqahmed.teleprompter</footer>
</main>
</body>
</html>
