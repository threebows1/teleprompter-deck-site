<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Tools · My Second Wish</title>
<meta name="description" content="Free PDF tools in your browser: merge, split, compress, edit, sign, watermark, convert JPG to PDF and back, add or remove a password. Your files never leave your device.">
<meta property="og:title" content="PDF Tools · My Second Wish">
<meta property="og:description" content="Merge, split, compress, edit and sign PDFs right in your browser. Nothing is uploaded.">
<meta property="og:image" content="https://apps.mysecondwish.com/pdf-editor/icon-512.png">
<meta name="theme-color" content="#0a0a10">
<link rel="icon" href="/pdf-editor/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/pdf-editor/icon-512.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./" data-home><img src="icon.svg" alt="" width="30" height="30">PDF Tools</a>
  <a class="home" href="/">More apps by My Second Wish ↗</a>
</header>

<main id="app">
  <!-- Filled by js/app.js: the tool grid, or one tool's workspace. -->
  <noscript><p class="note">PDF Tools needs JavaScript turned on.</p></noscript>
</main>

<footer class="bottom">
  <span>Your files are processed on this device and never uploaded.</span>
  <span>© <span id="y">2026</span> <a href="/">My Second Wish</a> · <a href="privacy/">Privacy</a></span>
</footer>

<div id="busy" class="busy" hidden>
  <div class="busy__box"><span class="spinner"></span><p id="busy-text">Working…</p></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script type="module" src="js/app.js"></script>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
